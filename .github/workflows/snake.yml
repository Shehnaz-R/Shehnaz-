```yaml
name: Contribution Snake

'on':
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shehnaz-R
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%232563eb&color_dots=%23eaf4ff,%23bfdbfe,%2393c5fd,%2360a5fa,%232563eb
            dist/snake-dark.svg?palette=github-dark&color_snake=%2360a5fa&color_dots=%23161b22,%23172554,%231e40af,%233b82f6,%2360a5fa

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: output
          build_dir: dist
```
